name: email trigger

on:
  workflow_dispatch:
  schedule:
    - cron: '0/5 * * * *'
      timezone: 'Asia/Kolkata'
      
permissions: write-all

jobs:
  Email_Trigger:
    name: Email_Trigger
    runs-on: ubuntu-22.04

    steps:
      - name: Code Checkout
        uses: actions/checkout@v7
        
      - name: Install python
        uses: actions/setup-python@v7.0.0

      - name: python check
        run: |
          which python
          python --version
          python3 --version

      - name: Trigger Emails
        run: |
          python process_emails2.py
